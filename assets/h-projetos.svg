<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="100" viewBox="0 0 1000 100" role="img" aria-label="Projetos">
<title>Projetos</title><desc>o que dá pra abrir e ver</desc>
<defs><style>
@font-face{font-family:'Newsreader';font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Newsreader';font-style:italic;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:100 800;src:url(data:font/woff2;base64,) format('woff2')}

.c{fill:none;stroke:#1f2a24;stroke-width:1;stroke-dasharray:1;stroke-dashoffset:1;animation:desenha 1.6s cubic-bezier(.2,.7,.2,1) forwards}
.c.m{stroke:#3fb685;stroke-opacity:.42;stroke-width:1.4}
@keyframes desenha{to{stroke-dashoffset:0}}
@keyframes sobe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pisca{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes onda{0%{r:6;opacity:.7}100%{r:46;opacity:0}}
.s{opacity:0;animation:sobe .8s cubic-bezier(.2,.7,.2,1) forwards}
.onda{fill:none;stroke:#3fb685;stroke-width:1.5;animation:onda 3.2s ease-out infinite}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.sans{font-family:'Schibsted Grotesk',ui-sans-serif,system-ui,sans-serif}
.serif{font-family:Newsreader,ui-serif,Georgia,serif}

@media (prefers-reduced-motion:reduce){*{animation:none!important}.c{stroke-dashoffset:0}.s{opacity:1}}
</style><clipPath id="cl"><rect width="1000" height="100" rx="20"/></clipPath></defs>
<rect x=".5" y=".5" width="999" height="99" rx="20" fill="#0b100d" stroke="#1f2a24"/>
<g clip-path="url(#cl)">
<text class="mono s" x="40" y="52" font-size="14" fill="#3fb685" letter-spacing="2" style="animation-delay:.1s">03</text><text class="serif s" x="86" y="58" font-size="38" font-weight="500" fill="#f5f6f2" style="animation-delay:.2s">Projetos</text><text class="serif s" x="960" y="56" font-size="19" font-style="italic" fill="#8a978d" text-anchor="end" style="animation-delay:.35s">o que dá pra abrir e ver</text><path d="M40 82 H960" stroke="#1f2a24" stroke-width="1"/>
</g>
</svg>
